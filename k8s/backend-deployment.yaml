apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-cashwatch-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: geo-cashwatch-backend
  template:
    metadata:
      labels:
        app: geo-cashwatch-backend
    spec:
      containers:
      - name: backend
        image: geo-cashwatch-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_ENABLED
          value: "true"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: geo-cashwatch-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: geo-cashwatch-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geo-cashwatch-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
