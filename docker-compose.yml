version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app/backend
      - ./ai_engine:/app/ai_engine
      - ./graph_db:/app/graph_db
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws/alerts
      - VITE_USE_MOCK_STREAM=false
    volumes:
      - ./frontend:/app/frontend
      - /app/node_modules
    depends_on:
      - backend
    restart: always
